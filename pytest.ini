[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --timeout=600
markers =
    slow: takes more than a few seconds
    gpu: requires a CUDA device
    dataset: requires the real Mobile-HDR dataset on disk
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
